
services:
  postgres:
    image: postgres:16-alpine
    container_name: print3d-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-print3d}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-print3d}
      POSTGRES_DB: ${POSTGRES_DB:-print3d}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-print3d} -d ${POSTGRES_DB:-print3d}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: print3d-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20


  # minio: disabled in this environment (image registry pull blocked). Enable with a reachable image for S3-compatible storage.
  #minio:
  #  # image: quay.io/minio/minio:latest (registry access issue in this env); configure a valid MinIO image
  #  image: minio/minio:latest
  #  container_name: print3d-minio
  #  restart: unless-stopped
  #  command: server /data --console-address ":9001"
  #  environment:
  #    MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
  #    MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
  #  ports:
  #    - "9000:9000"
  #    - "9001:9001"
  #  volumes:
  #    - minio_data:/data
  #  healthcheck:
  #    test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
  #    interval: 10s
  #    timeout: 5s
  #    retries: 20

  n8n:
    image: n8nio/n8n:latest
    container_name: print3d-n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Sao_Paulo
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

  # Application services (server deployment): enable/build as needed on the target server.
  # api:
  #   build: { context: ., dockerfile: docker/api.Dockerfile }
  #   env_file: .env
  #   environment:
  #     DATABASE_URL: ${DATABASE_URL:-postgresql://print3d:print3d@postgres:5432/print3d?schema=public}
  #     REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  #   depends_on:
  #     postgres: { condition: service_healthy }
  #     redis: { condition: service_healthy }
  #   ports:
  #     - "3001:3001"

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    container_name: print3d-worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://print3d:print3d@postgres:5432/print3d?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SLICING_QUEUE_NAME: ${SLICING_QUEUE_NAME:-slicing-jobs}
      DRAGONFRUIT_MODE: ${DRAGONFRUIT_MODE:-auto}
      DRAGONFRUIT_CLI_PATH: ${DRAGONFRUIT_CLI_PATH:-/usr/local/bin/dragonfruit}
      DRAGONFRUIT_ALLOWED_PROFILES_DIR: ${DRAGONFRUIT_ALLOWED_PROFILES_DIR:-/app/config/dragonfruit-profiles}
      # DRAGONFRUIT_CLI_ATTEMPTS_JSON: ${DRAGONFRUIT_CLI_ATTEMPTS_JSON:-}
    volumes:
      - ./storage:/app/storage
      - ./config/dragonfruit-profiles:/app/config/dragonfruit-profiles
      - ./config/dragonfruit-plugins:/app/config/dragonfruit-plugins
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

